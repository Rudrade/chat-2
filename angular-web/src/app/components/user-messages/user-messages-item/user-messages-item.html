<div class="p-2 flex gap-4 hover:bg-blue-500 rounded-2xl hover:text-white hover:cursor-pointer">
  <img [src]="data().image" alt="User" class="w-16 h-16 rounded-4xl flex-none" />
  <div class="content-center">
    <h6 class="font-semibold">{{ data().name }}</h6>
    <p class="text-sm text-gray-500">{{ data().lastMessage }}</p>
  </div>
  <div class="flex flex-auto justify-end text-gray-500">
    {{ data().time | date: 'HH:mm' }}
  </div>
</div>
