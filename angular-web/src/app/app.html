<div class="grid grid-rows-[100px_1fr] h-svh">
  <div class="row-start-1 border-b-4 border-gray-200">
    <app-navbar [userName]="username" />
  </div>
  <div class="flex flex-row row-start-2">
    <div class="border-e-4 border-gray-200 basis-md">
      <app-user-messages (setChat)="setCurrentChat($event)" />
    </div>
    <div class="basis-full max-h-lvh">
      @if (currentChat()) {
        <app-chat [data]="currentChat()" />
      }
    </div>
  </div>
</div>
