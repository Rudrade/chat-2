#==============
#   database
#==============
org.springframework.test.context.jdbc=DEBUG
org.springframework.jdbc.datasource.init=DEBUG
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

#==============
#   SECURITY
#==============
app.security.allowed-origins=http://localhost:4200,http://localhost:80
app.security.jwt.secret=changeit
app.security.jwt.issuer=chatapp

#=============
#   Logging
#=============
logging.level.dev.rudrade.chat=TRACE
spring.jpa.show-sql=true